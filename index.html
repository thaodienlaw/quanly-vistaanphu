<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý The Vista An Phú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: thanh tiêu đề + 4 tab; mỗi tab là một màn hình thao tác, phần tóm tắt luôn nằm trên phần chi tiết. */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --ink:#18232b; --muted:#5a6870; --line:#dbe0dd;
  --accent:#0e6b5c; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --in:#0e6b5c; --out:#b9531f;
  --good:#1b7a43; --good-soft:#dff2e6; --warn:#8f5700; --warn-soft:#fbefd2; --bad:#b3261e; --bad-soft:#fbe3e0;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12181c; --surface:#1a2227; --ink:#e6ece9; --muted:#9aa9a3; --line:#2c383e;
    --accent:#4cc3a9; --accent-ink:#08211b; --accent-soft:#17352f;
    --in:#4cc3a9; --out:#f0916a;
    --good:#6fd39a; --good-soft:#173324; --warn:#e8b552; --warn-soft:#382c12; --bad:#ff8f86; --bad-soft:#3c2020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181c; --surface:#1a2227; --ink:#e6ece9; --muted:#9aa9a3; --line:#2c383e;
  --accent:#4cc3a9; --accent-ink:#08211b; --accent-soft:#17352f;
  --in:#4cc3a9; --out:#f0916a;
  --good:#6fd39a; --good-soft:#173324; --warn:#e8b552; --warn-soft:#382c12; --bad:#ff8f86; --bad-soft:#3c2020;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:700}
.brand small{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
@media(min-width:900px){nav.tabs{flex-wrap:wrap;overflow:visible}}
@media(max-width:600px){.top-row .btn{padding:6px 10px;font-size:13px}.top-row .actions{gap:6px}.filters label{flex:1 1 calc(50% - 10px)}.filters select,.filters input{width:100%}}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button:hover{color:var(--ink)}
main{padding:20px 0 56px;display:flex;flex-direction:column;gap:20px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;max-width:100%}
@media(max-width:600px){.btn{white-space:normal;text-align:left}}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.out{border-color:var(--out);color:var(--out)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.fund{display:flex;flex-direction:column;gap:8px}
.fund .label{color:var(--muted);font-size:13.5px;font-weight:500}
.fund .bal{font-size:30px;font-weight:700;letter-spacing:-.01em}
.fund .sub{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.in{color:var(--in)} .outc{color:var(--out)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .meta{display:block;font-size:12.5px;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:500}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden]),select{height:38px}
textarea{resize:vertical;min-height:64px}
.summary{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}
.summary b{font-weight:600}
.list{display:flex;flex-direction:column}
.list .item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list .item .t{min-width:0}
.list .item .t span{display:block;font-size:12.5px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:8px;overflow-x:auto}
.chart .m{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;align-items:flex-end;gap:4px;height:130px;width:100%;justify-content:center;border-bottom:1px solid var(--line)}
.chart .bar{width:44%;max-width:30px;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart .bar.i{background:var(--in)} .chart .bar.o{background:var(--out)}
.chart .bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap;padding-bottom:2px}
.chart .lab{font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(10,16,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;z-index:20}
td.num{white-space:nowrap}.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:70px}.pbar i{display:block;height:100%;background:var(--accent)}.pbar i.over{background:var(--bad)}.brow{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;margin:4px 0}.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.fields label input,.fields label select,.fields label textarea{color:var(--ink);font-weight:400;font-size:15px}
.check{flex-direction:row!important;align-items:center;gap:8px!important}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
body.no-txn [data-act="add-in"],body.no-txn [data-act="add-out"],body.no-txn [data-act="edit-txn"],body.no-txn [data-act="void-txn"],body.no-manage [data-act="add-maint"],body.no-manage [data-act="add-asset"],body.no-manage [data-act="edit-maint"],body.no-manage [data-act="edit-asset"],body.no-manage [data-act="del-maint"],body.no-manage [data-act="del-asset"],body.no-manage [data-act="add-notice"],body.no-manage [data-act="edit-notice"],body.no-manage [data-act="del-notice"],body.no-manage [data-act^="vendor-"],body.no-manage [data-act^="rating-"],body.no-manage [data-act="unit-new"],body.no-manage [data-act="unit-edit"],body.no-manage [data-act="veh-status"],body.no-manage [data-act="book-status"],body.no-manage [data-act="comment-del"],body.no-manage [data-act="del-fb"],body.no-manage [data-act="ballot-enter"],body.no-approve [data-act="approve"],body.no-govern [data-act="poll-new"],body.no-govern [data-act="poll-edit"],body.no-govern [data-act="poll-close"],body.no-govern [data-act="poll-remove"],body.no-govern [data-act="poll-impl"],body.no-govern [data-act="units-import"],body.no-govern [data-act="unit-remove"],body.no-facility [data-act="fac-new"],body.no-facility [data-act="fac-edit"],body.no-facility [data-act="fac-remove"],body.ro [data-act^="vendor-"],body.ro [data-act^="rating-"],body.ro [data-act="void-txn"],body.ro [data-act="approve"],body.ro [data-act="fdel"],body.noadm [data-admin],body.ro [data-act^="add"],body.ro [data-act^="edit"],body.ro [data-act^="del"],body.ro [data-act="seed"],body.ro [data-act="clear-sample"],body.ro #btnSettings,body.ro #btnPw{display:none!important}
.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.fb p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.foot{font-size:13px;color:var(--muted);text-align:center;padding:8px 16px 28px}
.foot a{color:var(--accent)}
@media (max-width:520px){.fields{grid-template-columns:1fr}.fund .bal{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s,filter .15s}}

.btn.small{padding:5px 10px;font-size:13px}
#who{font-size:13px;color:var(--muted);margin-right:4px;align-self:center}
tr.voided td{opacity:.55;text-decoration:line-through}tr.voided td .pill,tr.voided td .meta,tr.voided td button{text-decoration:none}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line)}
.thumb.pdf{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.rep{width:100%;min-width:0;border-collapse:collapse}.rep td{padding:6px 4px;border-bottom:1px solid var(--line)}.rep .strong td{font-weight:600}.rep .sub td{color:var(--muted);font-size:13px;padding-top:12px}.rep .total td{font-weight:700;font-size:16px;border-top:2px solid var(--ink)}
.rep-head{display:none}
.sign{display:none}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}a.btn.primary{color:var(--accent-ink)}
@media print{
 header.top,.noprint,#toast,#modal,.foot,.banner{display:none!important}
 body{background:#fff;color:#000}.card,.tablewrap{border:1px solid #bbb!important;box-shadow:none!important}
 .rep-head{display:block;text-align:center;margin-bottom:12px}
 .sign{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:28px;font-weight:600}
 .grid2{display:block}.rep-block{break-inside:avoid;margin-bottom:12px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><span id="orgName">The Vista An Phú</span><small>Quản lý quỹ bảo trì, quỹ vận hành và tài sản chung cư</small></div>
      <div class="actions"><span id="who"></span><button class="btn" data-act="feedback" id="btnFeedback">Góp ý</button><button class="btn" data-act="settings" id="btnSettings" data-admin="1">Cài đặt</button><button class="btn" data-act="passwd" id="btnPw">Đổi mật khẩu</button><button class="btn" data-act="totp" id="btnTotp" hidden>Bảo mật 2 bước</button><button class="btn ghost" data-act="logout" id="btnLogout" hidden>Đăng xuất</button></div>
    </div>
    <nav class="tabs" aria-label="Chuyên mục">
      <button data-tab="tong-quan">Tổng quan</button>
      <button data-tab="thong-bao">Thông báo</button>
      <button data-tab="thu-chi">Thu chi</button>
      <button data-tab="doi-chieu" id="tabBank" hidden>Đối chiếu</button>
      <button data-tab="tai-san">Tài sản</button>
      <button data-tab="bao-tri">Bảo trì</button>
      <button data-tab="cong-viec" id="tabTask" hidden>Công việc</button>
      <button data-tab="nha-thau">Nhà thầu</button>
      <button data-tab="can-ho" id="tabUnits" hidden>Căn hộ</button>
      <button data-tab="gui-xe" id="tabVeh" hidden>Gửi xe</button>
      <button data-tab="bieu-quyet">Biểu quyết</button>
      <button data-tab="tien-ich">Tiện ích</button>
      <button data-tab="bao-cao">Báo cáo</button>
      <button data-tab="gop-y" id="tabGopY" hidden>Góp ý nhận được</button>
      <button data-tab="nhat-ky" id="tabAudit" hidden>Nhật ký</button>
      <button data-tab="quan-tri" id="tabAdm" hidden>Quản trị</button>
    </nav>
  </div>
</header>
<div class="wrap"><main id="view" aria-live="polite"></main></div>
<div id="modal"></div>
<div id="toast" hidden></div>

<script>
"use strict";
/* ---------- hằng số và tiện ích ---------- */
const FUNDS={maint:"Quỹ bảo trì",ops:"Quỹ vận hành"};
const CATS={
  in:["Phí bảo trì (2%)","Phí quản lý vận hành","Phí gửi xe","Thu từ dịch vụ khác","Lãi tiền gửi","Thu khác"],
  out:["Bảo trì, sửa chữa","Mua sắm thiết bị","Điện, nước","Lương, nhân sự","Vệ sinh, môi trường","Bảo vệ, an ninh","Bảo hiểm, kiểm định","Chi khác"]
};
const KINDS=["Thiết bị","Máy móc","Xe","Khác"];
const STATUSES=["Tốt","Cần theo dõi","Hỏng","Ngưng sử dụng"];
const MKINDS=["Bảo trì","Sửa chữa","Kiểm định","Sử dụng","Đề xuất"];
const ATYPES=["Kế hoạch ngày","Kế hoạch tháng","Kế hoạch quý","Kế hoạch năm","Báo cáo tuần","Báo cáo tháng","Báo cáo quý","Báo cáo năm"];
const NTYPES=["Thông báo","Kế hoạch ngày","Kế hoạch tháng","Kế hoạch quý","Kế hoạch năm","Báo cáo tuần","Báo cáo tháng","Báo cáo quý","Báo cáo năm"];
const NORGS=["Ban quản lý","Ban quản trị"];
const orgOf=n=>n.org==="Đơn vị quản lý vận hành"?"Ban quản lý":(n.org||"");
const isPlan=n=>String(n.type).startsWith("Kế hoạch"),isRep=n=>String(n.type).startsWith("Báo cáo");
const NSTAT=["Dự kiến","Đang thực hiện","Hoàn thành"];
const ROLES={admin:"Trưởng ban (toàn quyền)",board:"Ban quản trị (duyệt chi, biểu quyết)",manager:"Ban quản lý (vận hành)",accountant:"Kế toán (ghi thu chi)",auditor:"Ban kiểm tra (chỉ xem)",editor:"Kế toán, Ban quản lý (nhập liệu, vai trò cũ)",staff:"Nhân viên (theo nhóm)",viewer:"Cư dân (chỉ xem)"};
const roleLabel=u=>u.role==="staff"?(u.gname||"Nhân viên, chưa có nhóm"):(ROLES[u.role]||u.role);
const CAPS_SHORT={fund:"Xem quỹ",txn:"Ghi thu chi",approve:"Duyệt chi lớn",manage:"Nhập liệu vận hành",seeall:"Xem hồ sơ nội bộ",facility:"Tiện ích",govern:"Biểu quyết, căn hộ",audit:"Xem nhật ký",resident:"Menu cư dân"};
const CAPL={fund:"Xem thu chi, số dư quỹ và báo cáo quỹ",txn:"Ghi, sửa, hủy thu chi và chứng từ thu chi",approve:"Duyệt khoản chi lớn",manage:"Nhập tài sản, bảo trì, nhà thầu, thông báo, báo cáo hoạt động; duyệt gửi xe",seeall:"Xem hồ sơ nội bộ: căn hộ, xe, hợp đồng nhà thầu",facility:"Quản lý tiện ích và lịch đặt",govern:"Tạo biểu quyết, quản lý danh sách căn hộ",audit:"Xem nhật ký thay đổi",resident:"Hiện các menu Căn hộ, Gửi xe, Biểu quyết, Tiện ích"};
const TABS=["tong-quan","thong-bao","thu-chi","doi-chieu","tai-san","bao-tri","cong-viec","nha-thau","can-ho","gui-xe","bieu-quyet","tien-ich","bao-cao","gop-y","nhat-ky","quan-tri"];
const VTYPES=["Xe máy","Ô tô","Xe điện","Xe đạp"];
const VSTAT=["Chờ duyệt","Đã duyệt","Từ chối","Ngừng"];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("vi-VN");
const money=n=>nf.format(Math.round(n||0))+" ₫";
const short=n=>{const v=n/1e6;return (Math.abs(v)>=100?Math.round(v):Math.round(v*10)/10).toString().replace(".",",")+" tr"};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const vdate=s=>{if(!s)return "";const [y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const vtime=ts=>new Date(ts*1000).toLocaleString("vi-VN");
const utc=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
const addMonths=(s,n)=>{const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return ymd(t)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const F=(id,label,inner,cls)=>`<label class="${cls||""}" for="${id}">${label}${inner}</label>`;
function opt(list,sel,all){return (all?`<option value="">${all}</option>`:"")+list.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return `<option value="${esc(v)}"${v===sel?" selected":""}>${esc(l)}</option>`}).join("")}

/* ---------- dữ liệu và kết nối ---------- */
let state={tasks:[],budgets:[],groups:[],txns:[],assets:[],maints:[],notices:[],vendors:[],vratings:[],comments:[],files:[],meta:{},settings:{name:"",openMaint:0,openOps:0,approvalLimit:0,notifyEmails:""}};
let loadErr=false; let grps=null, rules=null; let me=null, ready=false, loaded=0, fb=null, users=null, audit=null, units=null, vehs=null, polls=null, ballots={}, facs=null, books=null;
let filt={
  notice:{type:"",org:""},
  unit:{q:""},
  vendor:{q:""},
  veh:{status:"",type:"",q:""},
  gate:{date:"",q:"",result:""},

function dueStatus(due){
  const days=Math.round((utc(due)-utc(today()))/864e5);
  if(days<0)return{days,key:"over",label:"Quá hạn "+(-days)+" ngày",cls:"bad"};
  if(days<=30)return{days,key:"soon",label:days===0?"Đến hạn hôm nay":"Còn "+days+" ngày",cls:"warn"};
  return{days,key:"ok",label:"Còn "+days+" ngày",cls:"good"};
}
function assetInfo(a){
  const all=state.maints.filter(m=>m.assetId===a.id).sort((x,y)=>y.date.localeCompare(x.date));
  const svc=all.filter(m=>!["Kiểm định","Sử dụng","Đề xuất"].includes(m.kind)),ins=all.filter(m=>m.kind==="Kiểm định");
  const last=svc[0]?svc[0].date:null,insLast=ins[0]?ins[0].date:null;
  const info={last,insLast,logs:all,total:sum(all,m=>Number(m.cost)||0),due:null,days:null,key:"none",label:"Chưa đặt chu kỳ",cls:"mute",insDue:null,ins:null,war:null};
  if(a.status==="Ngưng sử dụng"){info.key="off";info.label="Ngưng sử dụng";return info}
  const cycle=Number(a.cycle)||0,base=last||a.buyDate||null;
  if(cycle&&base){info.due=addMonths(base,cycle);Object.assign(info,dueStatus(info.due))}
  const ic=Number(a.inspectCycle)||0,ib=insLast||a.buyDate||null;
  if(ic&&ib){info.insDue=addMonths(ib,ic);info.ins=dueStatus(info.insDue)}
  if(a.warrantyEnd)info.war=dueStatus(a.warrantyEnd);
  return info;
}
/** Mọi mốc cần theo dõi: bảo trì, kiểm định, bảo hành (còn ≤ 60 ngày). */
function dueAll(){
  const res=[];
  state.assets.forEach(a=>{
    const i=assetInfo(a);if(i.key==="off")return;
    if(i.due)res.push({a,kind:"Bảo trì",due:i.due,days:i.days,key:i.key,label:i.label,cls:i.cls});
    if(i.insDue)res.push({a,kind:"Kiểm định",due:i.insDue,days:i.ins.days,key:i.ins.key,label:i.ins.label,cls:i.ins.cls});
    if(i.war&&i.war.days>=0&&i.war.days<=60)res.push({a,kind:"Hết bảo hành",due:a.warrantyEnd,days:i.war.days,key:i.war.key,label:i.war.label,cls:i.war.cls});
  });
  state.vendors.filter(v=>v.status==="Đang hợp đồng"&&v.contractTo).forEach(v=>{const d=dueStatus(v.contractTo);if(d.days<=60)res.push({a:{name:v.name,code:"Nhà thầu"},kind:"Hết hạn hợp đồng",due:v.contractTo,days:d.days,key:d.key,label:d.label,cls:d.cls})});
  return res.sort((x,y)=>x.days-y.days);
}

  const chart=`<div class="chart" role="img" aria-label="${esc(lab)}">`+data.map(d=>`<div class="m"><div class="bars"><div class="bar i" style="height:${Math.max(2,d.i/max*100)}%"><span>${d.i?short(d.i):""}</span></div><div class="bar o" style="height:${Math.max(2,d.o/max*100)}%"><span>${d.o?short(d.o):""}</span></div></div><div class="lab">${d.mm.slice(5)}/${d.mm.slice(2,4)}</div></div>`).join("")+"</div>";
  const alerts=dueAll().filter(x=>x.key==="over"||x.key==="soon").slice(0,6);
  const notes=[...state.notices].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,3);
  const recent=[...state.txns].filter(t=>!t.voided).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,6);
  const F$=can("fund");
  return notices()+(F$?`<div class="grid2">${fundCard("maint")}${fundCard("ops")}</div>`:"")+`
  ${notes.length?`<section class="card"><div class="head-row"><h2>Thông báo, kế hoạch, báo cáo mới</h2><button class="btn small" data-tab="thong-bao">Xem tất cả</button></div><div class="list">${notes.map(n=>`<div class="item"><div class="t"><strong>${esc(n.title)}</strong><span>${esc(n.type)}${orgOf(n)?" · "+esc(orgOf(n)):""} · ${vdate(n.date)}</span></div>${n.status?`<span class="pill mute">${esc(n.status)}</span>`:""}</div>`).join("")}</div></section>`:""}
  <div class="grid2">
    <section class="card"><div class="head-row"><h2>Cần xử lý</h2><button class="btn small" data-tab="bao-tri">Xem lịch</button></div>${dueItems(alerts,"Không có mốc nào quá hạn hoặc sắp đến hạn trong 30 ngày.")}</section>
    ${F$?`<section class="card"><div class="head-row"><h2>Thu chi 6 tháng</h2><div class="legend"><span><i style="background:var(--in)"></i>Thu</span><span><i style="background:var(--out)"></i>Chi</span></div></div>${chart}</section>`:""}
  </div>
  ${F$?`<section class="card"><div class="head-row"><h2>Giao dịch gần đây</h2><div class="actions"><button class="btn small primary" data-act="add-in">+ Khoản thu</button><button class="btn small out" data-act="add-out">+ Khoản chi</button></div></div>
  ${recent.length?'<div class="list">'+recent.map(t=>`<div class="item"><div class="t"><strong>${esc(t.category)}</strong><span>${vdate(t.date)} · ${FUNDS[t.fund]||""}${t.party?" · "+esc(t.party):""}</span></div><div class="actions">${t.status==="pending"?'<span class="pill warn">Chờ duyệt</span>':""}<b class="num ${t.type==="in"?"in":"outc"}">${t.type==="in"?"+":"−"}${money(t.amount)}</b></div></div>`).join("")+"</div>":'<div class="empty">Chưa có giao dịch.</div>'}</section>`:""}`;
}


/* ---------- phiếu công việc ---------- */
const TCLS={"Đề xuất":"warn","Đã duyệt":"mute","Đang thực hiện":"good","Chờ nghiệm thu":"warn","Hoàn thành":"good","Từ chối":"bad","Đã hủy":"mute"};
const tOpen=t=>!["Hoàn thành","Từ chối","Đã hủy"].includes(t.status);
const groupName=id=>{const g=state.groups.find(x=>x.id===id);return g?g.name:""};
function taskActions(t){
  if(!can("manage"))return "";
  const b=(a,l,c)=>`<button class="btn small ${c||""}" data-act="task-${a}" data-id="${esc(t.id)}">${l}</button>`;
  switch(t.status){
    case "Đề xuất":return b("approve","Duyệt","primary")+b("reject","Từ chối")+b("edit","Sửa")+b("del","Xóa","danger");
    case "Đã duyệt":return b("start","Bắt đầu","primary")+b("edit","Sửa")+b("cancel","Hủy");
    case "Đang thực hiện":return b("submit","Báo hoàn thành","primary")+b("cancel","Hủy");
    case "Chờ nghiệm thu":return b("accept","Nghiệm thu","primary")+b("back","Trả lại");
    case "Từ chối":case "Đã hủy":return b("del","Xóa","danger");
  }
  return "";
}

    <label>Nhóm phụ trách<select id="ft-g" data-f="task.group">${opt(state.groups.map(g=>[g.id,g.name]),f.group,"Tất cả")}</select></label>

    try{await api("task_save",{id:t?t.id:"",title:fd.get("title").trim(),assetId:fd.get("assetId"),kind:fd.get("kind"),priority:fd.get("priority"),groupId:fd.get("groupId"),due:fd.get("due"),estCost:num(fd.get("estCost")),note:fd.get("note").trim()});await loadAll();render();toast(t?"Đã lưu phiếu.":"Đã tạo phiếu việc.")}catch(e){fail(e);return false}

function taskDetail(t){

  <div><strong>Lịch sử xử lý</strong><div class="list" style="margin-top:6px">${(t.trail||[]).slice().reverse().map(x=>`<div class="item"><div class="t"><strong>${esc(x.to)}</strong><span>${vtime(x.at)} · ${esc(x.name||"")}${x.note?" · "+esc(x.note):""}</span></div></div>`).join("")}</div></div>`,async()=>{},"Đóng",true);

function taskMove(t,to){
  const must=to==="Từ chối"||to==="Đã hủy"||(to==="Đang thực hiện"&&t.status==="Chờ nghiệm thu");
  const ttl={"Đã duyệt":"Duyệt phiếu","Từ chối":"Từ chối phiếu","Đang thực hiện":t.status==="Chờ nghiệm thu"?"Trả phiếu lại để làm tiếp":"Bắt đầu thực hiện","Chờ nghiệm thu":"Báo hoàn thành","Đã hủy":"Hủy phiếu"}[to];
  openModal(ttl+" "+t.code,`<p style="margin:0">${esc(t.title)}</p><div class="fields">${F("tm-note",must?"Lý do (bắt buộc)":"Ghi chú (không bắt buộc)",`<textarea id="tm-note" name="note" ${must?"required":""} maxlength="500"></textarea>`,"full")}</div>`,async fd=>{
    try{await api("task_move",{id:t.id,to,note:fd.get("note").trim()});await loadAll();render()}
    catch(e){if(e.status===403&&e.code!=="self_approve"&&(to==="Đã duyệt"||to==="Từ chối")){toast("Phiếu có dự toán lớn, cần Trưởng ban hoặc Ban quản trị duyệt.");return false}fail(e);return false}
  },ttl);
}
function taskAccept(t){
  openModal("Nghiệm thu "+t.code,`<p style="margin:0">${esc(t.title)}</p><div class="fields">
    ${F("ta-date","Ngày hoàn thành",`<input id="ta-date" name="date" type="date" required value="${today()}">`)}
    ${F("ta-cost","Chi phí thực tế (₫)",`<input id="ta-cost" name="cost" type="number" min="0" step="1" value="${esc(t.estCost||"")}">`)}
    ${F("ta-v","Đơn vị thực hiện",`<input id="ta-v" name="vendor" list="ta-vl" maxlength="120"><datalist id="ta-vl">${state.vendors.map(v=>`<option value="${esc(v.name)}">`).join("")}</datalist>`,"full")}
    ${F("ta-note","Ghi chú nghiệm thu",`<textarea id="ta-note" name="note" maxlength="500"></textarea>`,"full")}
    ${can("txn")?'<label class="check full" for="ta-tx"><input id="ta-tx" name="makeTxn" type="checkbox" checked> Ghi luôn khoản chi này vào Quỹ bảo trì</label>':'<p class="meta full" style="margin:0">Khoản chi vào quỹ do bộ phận kế toán ghi (tab Thu chi sẽ nhắc).</p>'}
  </div>`,async fd=>{
    const cost=num(fd.get("cost")),vendor=fd.get("vendor").trim(),date=fd.get("date");

      const j=await api("task_move",{id:t.id,to:"Hoàn thành",date,cost,vendor,note:fd.get("note").trim()});

      if(fd.get("makeTxn")&&cost>0&&j.maintId){const a=assetById(t.assetId);await put("txns","mt_"+j.maintId,{date,fund:"maint",type:"out",amount:cost,category:"Bảo trì, sửa chữa",party:vendor,note:t.kind+": "+t.title+(a?" · "+a.name:""),assetId:t.assetId,maintId:j.maintId});await loadAll()}
      render();toast("Đã nghiệm thu và ghi vào nhật ký bảo trì.");
    }catch(e){fail(e);return false}
  },"Nghiệm thu");

function unbookedMaints(){
  const l=state.maints.filter(m=>Number(m.cost)>0&&!m.txnId);
  if(!l.length)return "";
  return `<section class="card"><h3 style="margin-bottom:6px">Chi phí bảo trì chưa ghi vào quỹ</h3><div class="list">${l.slice(0,8).map(m=>{const a=assetById(m.assetId);return `<div class="item"><div class="t"><strong>${esc(m.code||"")} ${esc(m.title)}</strong><span>${vdate(m.date)}${a?" · "+esc(a.name):""}${m.vendor?" · "+esc(m.vendor):""}</span></div><div class="actions"><b class="num outc">${money(m.cost)}</b><button class="btn small primary" data-act="maint-to-txn" data-id="${esc(m.id)}">Ghi chi</button></div></div>`}).join("")}</div>${l.length>8?`<p class="meta">Còn ${l.length-8} khoản nữa.</p>`:""}</section>`;
}

/* ---------- dự toán ---------- */
const budgetOf=y=>state.budgets.find(b=>b.year===Number(y));
function budgetActual(y){const m={};state.txns.filter(t=>live(t)&&(t.date||"").slice(0,4)===String(y)).forEach(t=>{const k=t.fund+"|"+t.type+"|"+t.category;m[k]=(m[k]||0)+t.amount});return m}
function budgetWarn(){
  const y=new Date().getFullYear(),b=budgetOf(y);if(!b)return[];
  const a=budgetActual(y),w=[];
  b.lines.filter(l=>l.type==="out").forEach(l=>{const pc=(a[l.fund+"|out|"+l.category]||0)/l.amount*100;if(pc>=90)w.push(l.category+" ("+FUNDS[l.fund]+") "+(pc>=100?"đã vượt dự toán":"đã dùng "+Math.round(pc)+"% dự toán"))});
  return w;
}
function vBudget(sw){
  const y=Number(filt.rep.year)||new Date().getFullYear(),b=budgetOf(y),a=budgetActual(y);
  const head=`${sw}<div class="head-row noprint"><h2>Dự toán và thực hiện năm ${y}</h2><div class="actions">${can("approve")?`<button class="btn" data-act="budget-edit" data-year="${y}">${b?"Sửa dự toán":"Lập dự toán"}</button>`:""}<button class="btn primary" data-act="print">In hoặc lưu PDF</button></div></div>
  <div class="filters noprint"><label>Năm<input id="r-year" type="number" min="2000" max="2100" data-f="rep.year" value="${y}" style="width:96px"></label></div>`;
  if(!b)return head+`<div class="card empty">Chưa lập dự toán cho năm ${y}.${can("approve")?" Bấm “Lập dự toán” để nhập số tiền cho từng hạng mục.":" Trưởng ban hoặc Ban quản trị sẽ lập."}</div>`;
  const blocks=[];
  for(const f of ["maint","ops"])for(const ty of ["out","in"]){
    const cats=new Map();
    b.lines.filter(l=>l.fund===f&&l.type===ty).forEach(l=>cats.set(l.category,{bud:l.amount,act:0}));
    Object.entries(a).forEach(([k,v])=>{const [ff,tt,...c]=k.split("|");if(ff===f&&tt===ty){const cat=c.join("|");const r=cats.get(cat)||{bud:0,act:0};r.act=v;cats.set(cat,r)}});
    if(!cats.size)continue;
    const rows=[...cats.entries()],tb=sum(rows,x=>x[1].bud),ta=sum(rows,x=>x[1].act);
    const tr=(n,r,cls)=>{const pc=r.bud?r.act/r.bud*100:0,over=ty==="out"&&r.bud&&r.act>r.bud;return `<tr${cls?` class="${cls}"`:""}><td>${esc(n)}</td><td class="r num">${r.bud?money(r.bud):"chưa lập"}</td><td class="r num">${money(r.act)}</td><td class="r num ${over?"outc":""}">${r.bud?(r.bud-r.act<0?"−":"")+money(Math.abs(r.bud-r.act)):""}</td><td style="min-width:110px">${r.bud?`<div class="pbar" title="${Math.round(pc)}%"><i class="${over?"over":""}" style="width:${Math.min(100,pc)}%"></i></div><span class="meta">${Math.round(pc)}%</span>`:""}</td></tr>`};
    blocks.push(`<section class="card rep-block"><h3>${FUNDS[f]}: ${ty==="out"?"chi":"thu"}</h3><div class="tablewrap"><table class="rep"><thead><tr><th>Hạng mục</th><th class="r">Dự toán</th><th class="r">Thực hiện</th><th class="r">${ty==="out"?"Còn lại":"Chưa thu"}</th><th>Tỷ lệ</th></tr></thead><tbody>${rows.map(([n,r])=>tr(n,r)).join("")}${tr("Cộng",{bud:tb,act:ta},"total")}</tbody></table></div></section>`);
  }
  return head+`<p class="meta noprint" style="margin:0 0 10px">Thực hiện tính từ các khoản thu chi đã có hiệu lực trong năm (không tính khoản chờ duyệt và đã hủy). Hạng mục có thực hiện nhưng chưa có dự toán hiện “chưa lập”.</p><div style="display:flex;flex-direction:column;gap:16px">${blocks.join("")}</div>`;
}
function budgetForm(y){
  const b=budgetOf(y),lines=b?b.lines:[];
  const sec=(f,ty)=>{
    const known=CATS[ty],extra=lines.filter(l=>l.fund===f&&l.type===ty&&!known.includes(l.category)).map(l=>l.category);
    const val=c=>{const l=lines.find(x=>x.fund===f&&x.type===ty&&x.category===c);return l?l.amount:""};
    return `<div class="full"><strong style="font-size:13.5px">${FUNDS[f]}: ${ty==="out"?"dự toán chi":"dự toán thu"}</strong>${known.concat(extra).map(c=>`<div class="brow"><span>${esc(c)}</span><input type="number" min="0" step="1" name="b|${f}|${ty}|${esc(c)}" value="${esc(val(c))}" aria-label="${esc(c)}"></div>`).join("")}
      <div class="brow"><input name="nc|${f}|${ty}" maxlength="60" placeholder="Hạng mục khác" aria-label="Hạng mục khác"><input type="number" min="0" step="1" name="na|${f}|${ty}" aria-label="Số tiền hạng mục khác"></div></div>`;
  };
  openModal((b?"Sửa":"Lập")+" dự toán năm "+y,`<div class="fields">${["maint","ops"].map(f=>sec(f,"out")+sec(f,"in")).join("")}</div><p style="margin:0;font-size:13px;color:var(--muted)">Để trống hoặc 0 nếu không lập dự toán cho hạng mục đó.</p>`,async fd=>{
    const out=[],extra={};
    for(const [k,v] of fd.entries()){
      const p=k.split("|");const amt=num(v);
      if(p[0]==="b"&&amt>0)out.push({fund:p[1],type:p[2],category:p.slice(3).join("|"),amount:amt});
      else if(p[0]==="nc")(extra[p[1]+"|"+p[2]]=extra[p[1]+"|"+p[2]]||{}).c=String(v).trim();
      else if(p[0]==="na")(extra[p[1]+"|"+p[2]]=extra[p[1]+"|"+p[2]]||{}).a=amt;
    }
    Object.entries(extra).forEach(([k,e])=>{if(e.c&&e.a>0){const [f,ty]=k.split("|");out.push({fund:f,type:ty,category:e.c,amount:e.a})}});
    return !!(await put("budgets","y"+y,{year:Number(y),lines:out}));
  });

    const c=m.map(r=>r.slice());
    for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!fn[y][x]&&MASK[k](x,y))c[y][x]=!c[y][x];

}
function qrSvg(text,px){
  const m=qrMatrix(text),n=m.length,q=4;let d="";
  m.forEach((row,y)=>row.forEach((c,x)=>{if(c)d+=`M${x+q} ${y+q}h1v1h-1z`}));

}
const assetUrl=a=>location.origin+location.pathname+"#ts-"+encodeURIComponent(a.id);

function qrModal(a){

let bankDocs=null,gateLog=null,gateInfo=null;
async function loadBank(){try{bankDocs=(await api("bank_list")).items}catch(e){bankDocs=[];fail(e)}render()}
const dayDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
function parseTable(text){
  const t=text.replace(/^﻿/,""),first=t.split(/\r?\n/).find(l=>l.trim())||"";
  const delim=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);
  return rows;
}
function parseVN(s){
  s=String(s||"").replace(/[^\d,.\-()]/g,"").trim();if(!s)return 0;
  const neg=/^\(.*\)$/.test(s)||s.startsWith("-");s=s.replace(/[()\-]/g,"");
  const m=s.match(/^(\d{1,3}(?:[.,]\d{3})+)([.,]\d{1,2})?$/);let v;
  if(m)v=Number(m[1].replace(/[.,]/g,""))+(m[2]?Number("0."+m[2].slice(1)):0);
  else if(/^\d+[.,]\d{1,2}$/.test(s))v=Number(s.replace(",","."));
  else v=Number(s.replace(/[.,]/g,""));
  return isFinite(v)?(neg?-v:v):0;
}
function parseDMY(s){
  s=String(s||"").trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(m)return m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);
  m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  return m?m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]):"";
}
function detectCols(rows){
  const norm=x=>String(x||"").toLowerCase();
  let hi=-1;
  for(let i=0;i<Math.min(rows.length,20);i++){const r=rows[i].map(norm);if(r.some(c=>/ngày|date/.test(c))&&r.some(c=>/nợ|có|số tiền|debit|credit|amount|rút|gửi/.test(c))){hi=i;break}}
  const h=hi>=0?rows[hi].map(norm):[];
  const f=re=>h.findIndex(c=>re.test(c));
  return{header:hi,date:f(/ngày|date/),desc:f(/diễn giải|nội dung|mô tả|chi tiết|description|remark|narrat/),debit:f(/ghi nợ|nợ|rút|debit|tiền ra|chi/),credit:f(/ghi có|^có|có$|gửi|credit|tiền vào|thu/),amount:f(/số tiền|amount/)};
}
function bankUsed(){const u=new Set();(bankDocs||[]).forEach(d=>d.lines.forEach(l=>{if(l.txnId)u.add(l.txnId)}));return u}
function bankMatch(doc){
  const used=bankUsed();let n=0;
  doc.lines.filter(l=>!l.txnId&&!l.ign).forEach(l=>{
    const type=l.amount>0?"in":"out",amt=Math.abs(l.amount);
    const c=state.txns.filter(t=>t.fund===doc.fund&&t.type===type&&live(t)&&Math.abs(t.amount-amt)<0.5&&!used.has(t.id)&&Math.abs(dayDiff(t.date,l.date))<=5)
      .sort((a,b)=>Math.abs(dayDiff(a.date,l.date))-Math.abs(dayDiff(b.date,l.date)));
    if(c[0]){l.txnId=c[0].id;used.add(c[0].id);n++}});
  return n;
}
async function saveBank(doc){

  const d=j.doc,i=bankDocs.findIndex(x=>x.id===d.id);i>=0?bankDocs[i]=d:bankDocs.push(d);

function bankMap(fund,rows){

  const co=(cur,none)=>`<option value="-1"${cur<0?" selected":""}>${none||"Không có"}</option>`+Array.from({length:nc},(_,i)=>`<option value="${i}"${cur===i?" selected":""}>Cột ${i+1}${hdr[i]?": "+esc(String(hdr[i]).slice(0,28)):""}</option>`).join("");

  </div><div class="tablewrap"><table style="min-width:0"><tbody>${prev.map(r=>`<tr>${r.slice(0,6).map(c=>`<td>${esc(String(c).slice(0,24))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <p style="margin:0;font-size:13px;color:var(--muted)">${rows.length-start} dòng dữ liệu. Dùng cặp ghi nợ và ghi có, hoặc một cột số tiền. Các dòng được tách theo tháng, trùng với sao kê đã nhập sẽ được bỏ qua.</p>`,async fd=>{

/* ---------- báo cáo ---------- */
function repRange(){
  const r=filt.rep,y=Number(r.year)||new Date().getFullYear();
  if(r.period==="year")return{start:y+"-01-01",end:y+"-12-31",label:"Năm "+y};
  if(r.period==="month"){const mm=/^\d{4}-\d{2}$/.test(r.month)?r.month:today().slice(0,7);const [yy,m]=mm.split("-").map(Number);return{start:mm+"-01",end:mm+"-"+pad(new Date(yy,m,0).getDate()),label:"Tháng "+pad(m)+"/"+yy}}
  const q=Number(r.quarter)||1,m1=(q-1)*3+1,m3=m1+2;
  return{start:y+"-"+pad(m1)+"-01",end:y+"-"+pad(m3)+"-"+pad(new Date(y,m3,0).getDate()),label:"Quý "+q+"/"+y};
}
function fundReport(f,rg){
  const open=Number(f==="maint"?state.settings.openMaint:state.settings.openOps)||0;
  const mine=state.txns.filter(t=>t.fund===f&&live(t));
  const opening=open+sum(mine.filter(t=>t.date<rg.start),t=>t.type==="in"?t.amount:-t.amount);
  const inR=mine.filter(t=>t.date>=rg.start&&t.date<=rg.end);
  const group=type=>{const m={};inR.filter(t=>t.type===type).forEach(t=>m[t.category]=(m[t.category]||0)+t.amount);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const ins=group("in"),outs=group("out"),tin=sum(ins,x=>x[1]),tout=sum(outs,x=>x[1]);
  const pend=state.txns.filter(t=>t.fund===f&&t.status==="pending"&&!t.voided&&t.date>=rg.start&&t.date<=rg.end);
  const rows=(arr,cls)=>arr.length?arr.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="r num ${cls}">${money(v)}</td></tr>`).join(""):'<tr><td colspan="2" class="meta">Không có</td></tr>';
  return `<section class="card rep-block"><h3>${FUNDS[f]}</h3><table class="rep"><tbody>
    <tr class="strong"><td>Số dư đầu kỳ</td><td class="r num">${money(opening)}</td></tr>
    <tr class="sub"><td colspan="2">Thu trong kỳ</td></tr>${rows(ins,"in")}
    <tr class="strong"><td>Tổng thu</td><td class="r num in">${money(tin)}</td></tr>
    <tr class="sub"><td colspan="2">Chi trong kỳ</td></tr>${rows(outs,"outc")}
    <tr class="strong"><td>Tổng chi</td><td class="r num outc">${money(tout)}</td></tr>
    <tr class="total"><td>Số dư cuối kỳ</td><td class="r num">${money(opening+tin-tout)}</td></tr></tbody></table>
    ${pend.length?`<p class="meta" style="margin:8px 0 0">Chưa tính: ${pend.length} khoản chi chờ duyệt, tổng ${money(sum(pend,t=>t.amount))}.</p>`:""}</section>`;
}

function vFinReport(){
  const r=filt.rep,rg=repRange();

  const ms=state.maints.filter(m=>m.date>=rg.start&&m.date<=rg.end).sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="head-row noprint"><h2>Báo cáo thu chi</h2><button class="btn primary" data-act="print">In hoặc lưu PDF</button></div>
  <div class="filters noprint">
    <label>Kỳ<select id="r-period" data-f="rep.period">${opt([["month","Tháng"],["quarter","Quý"],["year","Năm"]],r.period)}</select></label>
    ${r.period==="month"?`<label>Tháng<input id="r-month" type="month" data-f="rep.month" value="${esc(r.month)}"></label>`:`<label>Năm<input id="r-year" type="number" min="2000" max="2100" data-f="rep.year" value="${esc(r.year)}" style="width:96px"></label>`}
    ${r.period==="quarter"?`<label>Quý<select id="r-quarter" data-f="rep.quarter">${opt([["1","Quý 1"],["2","Quý 2"],["3","Quý 3"],["4","Quý 4"]],r.quarter)}</select></label>`:""}
    <label>Quỹ<select id="r-fund" data-f="rep.fund">${opt(Object.entries(FUNDS),r.fund,"Cả hai quỹ")}</select></label>
  </div>

const vkey=v=>String(v||"").trim().toLowerCase();
function vendorJobs(v){
  const k=vkey(v.name);
  const ms=state.maints.filter(m=>vkey(m.vendor)===k).map(m=>({date:m.date,what:(m.kind||"Bảo trì")+": "+m.title,cost:Number(m.cost)||0,asset:(assetById(m.assetId)||{}).name||""}));
  const ts=state.txns.filter(t=>live(t)&&t.type==="out"&&!t.maintId&&vkey(t.party)===k).map(t=>({date:t.date,what:t.category+(t.note?": "+t.note:""),cost:t.amount,asset:(assetById(t.assetId)||{}).name||""}));
  return [...ms,...ts].sort((a,b)=>b.date.localeCompare(a.date));
}
function vendorScore(v){
  const r=state.vratings.filter(x=>x.vendorId===v.id);
  if(!r.length)return{n:0,avg:0,q:0,t:0,p:0,a:0};
  const m=f=>sum(r,x=>x[f]||0)/r.length;
  const q=m("quality"),t=m("timeliness"),p=m("price"),a=m("attitude");
  return{n:r.length,avg:(q+t+p+a)/4,q,t,p,a};
}
const stars=n=>n?`<b class="num">${(Math.round(n*10)/10).toFixed(1)}</b>/5`:'<span class="meta" style="display:inline">Chưa đánh giá</span>';
function contractPill(v){
  if(v.status!=="Đang hợp đồng")return `<span class="pill mute">${esc(v.status||"")}</span>`;
  if(!v.contractTo)return '<span class="pill good">Đang hợp đồng</span>';
  const d=dueStatus(v.contractTo);
  return `<span class="pill ${d.key==="over"?"bad":d.key==="soon"?"warn":"good"}">${d.key==="over"?"Quá hạn hợp đồng":"Hợp đồng đến "+vdate(v.contractTo)}</span>`;
}

function pollBlock(p){
  const ed=isEd(),adm=can("govern"),myU=polls.myUnit;
  const tot=polls.totalUnits,totA=polls.totalArea;
  const st=p.closed?'<span class="pill mute">Đã chốt</span>':p.open?'<span class="pill good">Đang mở</span>':'<span class="pill mute">Hết hạn</span>';
  const res=p.tally?`<div style="display:grid;gap:8px;margin-top:10px">${p.options.map(o=>{const t=p.tally[o]||{units:0,area:0},pc=p.voted?Math.round(t.units/p.voted*100):0;return `<div><div style="display:flex;justify-content:space-between;gap:8px;font-size:14px"><span>${esc(o)}${p.myChoice===o?" (căn bạn chọn)":""}</span><span class="num">${t.units} căn · ${fnum(t.area)} m² · ${pc}%</span></div><div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden"><div style="width:${pc}%;height:100%;background:var(--accent)"></div></div></div>`}).join("")}<div class="meta num">Đã bỏ phiếu: ${p.voted}/${tot} căn (${tot?Math.round(p.voted/tot*100):0}%), ${fnum(p.votedArea)}/${fnum(totA)} m² (${totA?Math.round(p.votedArea/totA*100):0}% diện tích)</div></div>`:`<div class="meta" style="margin-top:8px">Kết quả hiển thị sau khi biểu quyết kết thúc. Đã có ${p.voted} căn bỏ phiếu.</div>`;
  const vote=(p.open&&myU)?`<div style="margin-top:10px"><div class="meta" style="margin-bottom:6px">${p.myChoice?"Bạn đã chọn “"+esc(p.myChoice)+"” cho căn "+esc(myU)+". Có thể đổi đến khi hết hạn.":"Căn "+esc(myU)+" chưa bỏ phiếu."}</div><div class="actions">${p.options.map(o=>`<button class="btn small ${p.myChoice===o?"primary":""}" data-act="poll-vote" data-id="${esc(p.id)}" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`:(p.open&&!ed?'<div class="meta" style="margin-top:8px">Cần tài khoản gắn với căn hộ để bỏ phiếu. Liên hệ Ban quản trị.</div>':"");
  return `<section class="card"><div class="head-row"><h3>${esc(p.title)} ${st}</h3><div class="actions">${ed&&p.open?`<button class="btn small" data-act="ballot-enter" data-id="${esc(p.id)}">Nhập phiếu giấy</button>`:""}${ed?`<button class="btn small" data-act="ballot-view" data-id="${esc(p.id)}">Xem phiếu</button>`:""}${p.closed||!p.open?`<button class="btn small" data-act="poll-impl" data-id="${esc(p.id)}" data-admin="1">Tiến độ thực hiện</button>`:""}<button class="btn small" data-act="poll-edit" data-id="${esc(p.id)}" data-admin="1">Sửa</button><button class="btn small" data-act="poll-close" data-id="${esc(p.id)}" data-closed="${p.closed?0:1}" data-admin="1">${p.closed?"Mở lại":"Chốt"}</button><button class="btn small danger" data-act="poll-remove" data-id="${esc(p.id)}" data-admin="1">Xóa</button></div></div>
  <div class="meta">${p.deadline?"Hạn bỏ phiếu: "+vdate(p.deadline)+" · ":""}Đăng bởi ${esc(p.byName||"")} · ${vtime(p.created)}</div>${p.body?`<p style="white-space:pre-wrap;margin:8px 0 0">${esc(p.body)}</p>`:""}${res}${(p.closed||!p.open)?`<div class="meta" style="margin-top:10px">Thực hiện nghị quyết: <span class="pill ${p.impl==="Đã thực hiện"?"good":p.impl==="Đang thực hiện"?"warn":"mute"}">${esc(p.impl||"Chưa cập nhật")}</span>${p.implNote?" "+esc(p.implNote):""}</div>`:""}${vote}</section>`;
}

  const ed=isEd(),adm=can("facility"),myU=books.myUnit,td=today(),end7=ymd(new Date(Date.now()+7*864e5));
  const canBook=ed||!!myU;
  const fname=id=>(facs.find(f=>f.id===id)||{name:"(đã xóa)"}).name;
  const cls=st=>st==="Đã duyệt"?"good":st==="Chờ duyệt"?"warn":st==="Hoàn thành"?"mute":"bad";
  const pend=books.items.filter(b=>b.status==="Chờ duyệt"&&b.unit);
  const mine=books.items.filter(b=>b.mine&&b.date>=td).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));

/* ---------- tổng hợp hoạt động (trong báo cáo) ---------- */
function orgBlock(title,org,rows,nt){
  const mine=nt.filter(n=>orgOf(n)===org),reps=mine.filter(isRep),pls=mine.filter(isPlan),pc=st=>pls.filter(n=>(n.status||"Dự kiến")===st).length;
  const all=[...reps,...pls].sort((a,b)=>b.date.localeCompare(a.date));
  const r=[...rows,["Báo cáo đã đăng",reps.length],["Kế hoạch: dự kiến / đang thực hiện / hoàn thành",`${pc("Dự kiến")} / ${pc("Đang thực hiện")} / ${pc("Hoàn thành")}`],["Thông báo đã đăng",mine.filter(n=>n.type==="Thông báo").length]];
  return `<section class="card rep-block"><h3>${esc(title)} trong kỳ</h3><table class="rep"><tbody>${r.map(x=>`<tr><td>${esc(x[0])}</td><td class="r num">${esc(x[1])}</td></tr>`).join("")}</tbody></table>${all.length?'<div class="list" style="margin-top:8px">'+all.map(n=>`<div class="item"><div class="t"><strong>${esc(n.title)}</strong><span>${esc(n.type)} · ${vdate(n.date)}${n.status?" · "+esc(n.status):""}</span></div></div>`).join("")+"</div>":""}</section>`;
}
function activityReport(rg){
  if(polls===null){loadPolls();}
  if(books===null){loadBooks();}
  const inR=d=>d&&d>=rg.start&&d<=rg.end;
  const key=v=>String(v||"").trim().toLowerCase();
  const map={};
  const add=(vendor,date,cost,what,kind)=>{const k=key(vendor);if(!k)return;const m=map[k]||(map[k]={name:vendor.trim(),n:0,sum:0,last:"",items:[]});m.n++;m.sum+=cost;if(date>m.last)m.last=date;if(m.items.length<3)m.items.push(what);};
  state.maints.filter(m=>inR(m.date)).forEach(m=>add(m.vendor,m.date,Number(m.cost)||0,(m.kind||"Bảo trì")+": "+m.title));
  state.txns.filter(t=>live(t)&&t.type==="out"&&inR(t.date)&&!t.maintId&&t.party).forEach(t=>add(t.party,t.date,t.amount,t.category));
  const vendors=Object.values(map).sort((a,b)=>b.sum-a.sum);
  const tx=state.txns.filter(t=>inR(t.date));
  const mt=state.maints.filter(m=>inR(m.date));
  const nt=state.notices.filter(n=>inR(n.date));
  const plans=nt.filter(isPlan);
  const pc=st=>plans.filter(n=>(n.status||"Dự kiến")===st).length;
  const pl=polls&&polls.items?polls.items:[];
  const polls_in=pl.filter(p=>{const d=new Date(p.created*1000);return inR(ymd(d))});
  const bk=books&&books.items?books.items.filter(b=>inR(b.date)&&b.status==="Đã duyệt"||inR(b.date)&&b.status==="Hoàn thành"):[];
  const impl=pl.filter(p=>p.closed||!p.open);
  return `<section class="card rep-block"><h3>Nhà thầu, đơn vị cung cấp dịch vụ trong kỳ</h3>${vendors.length?`<div class="tablewrap" style="border:0"><table><thead><tr><th>Đơn vị</th><th>Hợp đồng</th><th>Điểm</th><th class="r">Số việc</th><th class="r">Tổng chi</th><th>Gần nhất</th><th>Công việc</th></tr></thead><tbody>${vendors.map(v=>{const vd=state.vendors.find(x=>vkey(x.name)===vkey(v.name)),sc=vd?vendorScore(vd):{n:0,avg:0};return `<tr><td><strong>${esc(v.name)}</strong></td><td>${vd?contractPill(vd):"—"}</td><td>${sc.n?stars(sc.avg):"—"}</td><td class="r num">${v.n}</td><td class="r num">${money(v.sum)}</td><td class="num">${vdate(v.last)}</td><td>${v.items.map(esc).join("; ")}${v.n>v.items.length?"…":""}</td></tr>`}).join("")}</tbody></table></div>`:'<p class="meta">Không có đơn vị nào trong kỳ.</p>'}</section>
  ${orgBlock("Báo cáo hoạt động của Ban quản trị","Ban quản trị",[["Khoản chi lớn đã duyệt / đang chờ duyệt",`${tx.filter(t=>t.approvedBy&&!t.voided).length} / ${tx.filter(t=>t.status==="pending"&&!t.voided).length}`],["Khoản bị hủy (còn lưu trong sổ)",tx.filter(t=>t.voided).length],["Biểu quyết đã tạo trong kỳ",polls===null?"…":polls_in.length]],nt)}
  ${orgBlock("Báo cáo hoạt động của Ban quản lý (đơn vị quản lý vận hành)","Ban quản lý",[["Khoản thu, chi đã ghi",tx.filter(t=>!t.voided).length],["Lượt bảo trì, sửa chữa, kiểm định",mt.filter(m=>!["Sử dụng","Đề xuất"].includes(m.kind)).length],["Lượt đặt tiện ích đã duyệt",books===null?"…":bk.length]],nt)}
  <section class="card rep-block"><h3>Tình hình thực hiện các biểu quyết</h3>${polls===null?'<p class="meta">Đang tải…</p>':impl.length?`<div class="list">${impl.map(p=>{const top=p.tally?p.options.slice().sort((a,b)=>(p.tally[b]||{units:0}).units-(p.tally[a]||{units:0}).units)[0]:"";return `<div class="item"><div class="t"><strong>${esc(p.title)}</strong><span>Kết quả: ${top?esc(top)+" ("+((p.tally[top]||{}).units||0)+"/"+p.voted+" căn)":"chưa công bố"}${p.implNote?" · "+esc(p.implNote):""}</span></div><span class="pill ${p.impl==="Đã thực hiện"?"good":p.impl==="Đang thực hiện"?"warn":"mute"}">${esc(p.impl||"Chưa cập nhật")}</span></div>`}).join("")}</div>`:'<p class="meta">Chưa có biểu quyết nào đã kết thúc.</p>'}</section>`;
}

function openModal(title,body,onSubmit,okLabel,noCancel){
  const m=$("#modal");
  m.innerHTML=`<div class="overlay" id="ov"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(title)}</h2>${body}<div class="modal-actions">${noCancel?"":'<button type="button" class="btn" data-close="1">Hủy</button>'}<button type="submit" class="btn primary">${esc(okLabel||"Lưu")}</button></div></form></div>`;
  const form=$("#mform");
  let busy=false;
  form.addEventListener("submit",async e=>{e.preventDefault();if(busy)return;busy=true;const ok=form.querySelector("button[type=submit]");if(ok)ok.disabled=true;
    let r;try{r=await onSubmit(new FormData(form),form)}finally{busy=false;if(ok&&ok.isConnected)ok.disabled=false}
    if(r!==false)closeModal()});
  const first=form.querySelector("input:not([type=hidden]):not([type=file]),select,textarea");if(first)first.focus();
}
function closeModal(){$("#modal").innerHTML=""}
function confirmBox(title,text,okLabel,fn){

}

function maintForm(m,assetId,kind){
  if(!state.assets.length){toast("Hãy thêm tài sản trước khi ghi bảo trì.");location.hash="tai-san";return}
  const cur=m||{date:today(),assetId:assetId||state.assets[0].id,kind:kind||"Bảo trì",title:kind==="Kiểm định"?"Kiểm định định kỳ":"Bảo trì định kỳ",vendor:"",cost:"",fund:"maint",note:"",txnId:""};
  const linked=m?!!m.txnId:true;
  openModal(m?"Sửa lần bảo trì":(kind==="Kiểm định"?"Ghi kiểm định":"Ghi bảo trì"),`<div class="fields">
    ${F("m-date","Ngày thực hiện",`<input id="m-date" name="date" type="date" required value="${esc(cur.date)}">`)}
    ${F("m-kind","Loại",`<select id="m-kind" name="kind">${opt(MKINDS,cur.kind||"Bảo trì")}</select>`)}
    ${F("m-asset","Tài sản",`<select id="m-asset" name="assetId" required>${opt(state.assets.map(a=>[a.id,(a.code?a.code+" · ":"")+a.name]),cur.assetId)}</select>`,"full")}
    ${F("m-title","Nội dung",`<input id="m-title" name="title" required value="${esc(cur.title)}">`,"full")}
    ${F("m-vendor","Đơn vị thực hiện",`<input id="m-vendor" name="vendor" value="${esc(cur.vendor||"")}">`,"full")}
    ${F("m-cost","Chi phí (₫)",`<input id="m-cost" name="cost" type="number" min="0" step="1" value="${esc(cur.cost||"")}">`)}
    ${can("txn")?F("m-fund","Chi từ quỹ",`<select id="m-fund" name="fund">${opt(Object.entries(FUNDS),cur.fund||"maint")}</select>`)+`<label class="check full" for="m-tx"><input id="m-tx" name="makeTxn" type="checkbox"${linked?" checked":""}> Tự ghi khoản chi này vào quỹ</label>`:'<p class="meta full" style="margin:0">Khoản chi vào quỹ do bộ phận kế toán ghi.</p>'}
    ${F("m-note","Ghi chú",`<textarea id="m-note" name="note">${esc(cur.note||"")}</textarea>`,"full")}
  </div>`,async fd=>{
    const id=m?m.id:"m"+uid();
    const cost=num(fd.get("cost"));
    const tx$=can("txn");
    const make=tx$&&!!fd.get("makeTxn")&&cost>0;
    const oldTx=m&&m.txnId?state.txns.find(t=>t.id===m.txnId):null;
    const txnId=tx$?(make?"mt_"+id:""):(m&&m.txnId||"");
    const data={date:fd.get("date"),assetId:fd.get("assetId"),kind:fd.get("kind"),title:fd.get("title").trim(),vendor:fd.get("vendor").trim(),cost,fund:tx$?fd.get("fund"):(m&&m.fund||"maint"),note:fd.get("note").trim(),txnId};
    if(m&&m.sample)data.sample=true;
    if(!await put("maints",id,data))return false;
    const a=assetById(data.assetId);
    if(!tx$){
      /* không có quyền ghi thu chi: giữ nguyên liên kết quỹ cũ */
    }else if(make){
      if(!(oldTx&&oldTx.voided))await put("txns",txnId,{date:data.date,fund:data.fund,type:"out",amount:cost,category:"Bảo trì, sửa chữa",party:data.vendor,note:data.kind+": "+data.title+(a?" · "+a.name:""),assetId:data.assetId,maintId:id,...(data.sample?{sample:true}:{})});
    }else if(oldTx&&!oldTx.voided){
      await voidTxn(oldTx.id,"Bỏ ghi chi phí khi sửa lần bảo trì");
    }
  });
}

const ruleSample=(r,ex)=>{
  const pf=r.prefix||"MÃ NHÓM",y=r.year?(ex?String(new Date().getFullYear()):"NĂM"):"",n=r.width?(ex?"1".padStart(r.width,"0"):"#".repeat(r.width)):"";
  if(!r.width)return ex?pf+"-KT":pf+"-VIẾT TẮT";
  return [r.prefix?(ex&&!r.prefix?"KT":pf):(ex?"KT":pf),y,n].filter(Boolean).join("-");
};

/* ---------- chứng từ đính kèm ---------- */
async function prepFile(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{
    const bmp=await createImageBitmap(file),max=1800,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(sc===1&&file.size<1.5e6)return file;
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    return blob?new File([blob],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file;
  }catch(e){return file}
}
async function uploadFile(col,id,file){
  const fd=new FormData();fd.append("col",col);fd.append("id",id);fd.append("file",file);
  const r=await fetch("api.php?a=upload",{method:"POST",headers:{"X-Upload":"1"},credentials:"same-origin",body:fd});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j.error||"error");e.status=r.status;e.code=j.error;throw e}
  return j.file;
}

function exportCsv(name,head,rows){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const text="﻿"+[head,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

function onFilter(e){
  const el=e.target.closest("[data-f]");if(!el)return;
  if(e.type==="input"&&!el.dataset.live)return;
  if(e.type==="change"&&el.dataset.live)return;
  const [g,k]=el.dataset.f.split(".");filt[g][k]=el.value;render();
}
document.addEventListener("input",onFilter);
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.tm){filt.task.mine=e.target.checked;render()}});
document.addEventListener("change",async e=>{
  onFilter(e);
  if(e.target.id==="fup"&&filesCtx){
    const files=[...e.target.files],stat=$("#fstat");e.target.value="";
    for(const f of files){
      try{stat.textContent="Đang tải lên "+f.name+"…";const file=await prepFile(f);const rec=await uploadFile(filesCtx.col,filesCtx.id,file);state.files.push(rec);drawFiles();render()}
      catch(err){fail(err)}
    }
    if($("#fstat"))$("#fstat").textContent="Nhận ảnh JPG, PNG, WebP và PDF, tối đa 10 tệp. Ảnh lớn được thu nhỏ tự động.";
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){filesCtx=null;detailCtx=null;closeModal()}});

document.addEventListener("submit",async e=>{
  if(e.target.id!=="loginForm")return;
  e.preventDefault();
  const btn=e.target.querySelector("button");btn.disabled=true;
  const fd=new FormData(e.target);
  try{
    me=await api("login",{username:fd.get("username"),password:fd.get("password"),code:fd.get("code")});
    fb=null;users=null;audit=null;units=null;vehs=null;polls=null;ballots={};facs=null;books=null;
    if(me.mustChange){render();forcePw();return}
    await loadAll();render();
  }catch(err){
    me=null;btn.disabled=false;
    if(err.code==="need_totp"){const bx=$("#lgCodeBox");if(bx){bx.hidden=false;$("#lg-code").focus()}toast("Nhập mã xác thực 6 số từ ứng dụng Authenticator.");return}
    if(err.status===401&&!$("#lgCodeBox").hidden){toast(ERR.bad_code);return}
    toast(err.status===429?"Nhập sai nhiều lần. Thử lại sau 10 phút.":err.status===401?"Tên đăng nhập hoặc mật khẩu chưa đúng.":"Không đăng nhập được. Thử lại sau.");
  }
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
setInterval(refresh,30000);
(async()=>{
  render();
  try{const j=await api("me");me=j.role?j:null;if(me&&!me.mustChange){try{await loadAll()}catch(e){if(e.status===401)me=null;else loadErr=true}}}catch(e){me=null}
  ready=true;render();if(me&&me.mustChange)forcePw();
})();
